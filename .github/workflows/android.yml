name: Build Android (Release)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 📦 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: ✅ Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: 📲 Install platform & build-tools
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      # 🔐 Restaurar keystore dos Secrets
- name: 🔐 Restore Keystore
  run: |
    echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > futanium-release.keystore

- name: 🔍 Verificar keystore
  run: ls -lh futanium-release.keystore

      # 🏗️ Build em modo RELEASE
      - name: 🏗️ Build Release APK
        working-directory: futanium-box-3.1
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace

      # 📦 Faz upload do APK final
      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: futanium-box-3.1/app/build/outputs/apk/release/app-release.apk

      # 🚀 Publica na aba "Releases"
      - name: 🚀 Publicar APK no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          body: |
            🆕 Nova versão do app Futanium Box!
            🔸 Compilação: ${{ github.run_number }}
            🔸 Tipo: Release assinada automaticamente
            🔸 Data: ${{ github.event.head_commit.timestamp }}
          files: futanium-box-3.1/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}