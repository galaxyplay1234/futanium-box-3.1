name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar release e enviar o APK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: futanium-box-3.1
          arguments: :app:assembleDebug

      # Opcional: se quiser ainda manter o artifact zipado, deixe este passo.
      # Caso contrário, remova-o.
      # - name: Upload APK as artifact (zipado)
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-debug
      #     path: futanium-box-3.1/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with raw APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          draft: false
          prerelease: false
          files: futanium-box-3.1/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}